name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - firebase/firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPAS_98DD7 }}

      - name: Deploy Firestore rules
        run: npx firebase deploy --only firestore:rules --project compas-98dd7 --non-interactive
