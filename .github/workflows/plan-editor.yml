name: Plan editor regression
on:
  pull_request:
    paths:
      - 'src/ui/components/PlanPreparationPanel.tsx'
      - 'src/domain/action-plan-catalog/**'
      - 'tests/plan-editor-whitespace.test.tsx'
      - '.github/workflows/plan-editor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/plan-editor-whitespace.test.tsx tests/definitive-action-plan-preview.test.tsx
